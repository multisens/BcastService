name: Build, push e bump submodule bcast em TV30

on:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bcast (self)
        uses: actions/checkout@v4
        with:
          path: bcast

      - name: Checkout Infra (Dockerfile)
        uses: actions/checkout@v4
        with:
          repository: multisens/Infra
          token: ${{ secrets.TV30_REPO_TOKEN }}
          path: infra

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push tv30-bcast
        uses: docker/build-push-action@v5
        with:
          context: ./bcast
          file: ./infra/dockerfiles/bcast.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-bcast:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-bcast:latest

  bump:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (super-projeto)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Atualizar ponteiro do submodule bcast
        env:
          BCAST_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "Luis Claudio Ribeiro Junior"
          git config user.email "luis.claudio.r.jr@gmail.com"

          CURRENT=$(git ls-tree HEAD bcast | awk '{print $3}')
          if [ "$CURRENT" = "$BCAST_SHA" ]; then
            echo "Ponteiro ja em $BCAST_SHA — sem mudancas"
            exit 0
          fi

          echo "Atualizando ponteiro do submodule bcast: $CURRENT -> $BCAST_SHA"
          git update-index --cacheinfo 160000 "$BCAST_SHA" bcast

          git commit -m "chore: bump submodule bcast pra ${BCAST_SHA:0:7}"

          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push falhou apos 3 tentativas"
          exit 1
